<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinking Blocks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .thinking-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 600px;
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .thinking-block {
            background: rgba(20, 20, 30, 0.95);
            border-left: 4px solid #00d4ff;
            padding: 15px;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .thinking-block.reasoning {
            border-left-color: #00d4ff;
        }

        .thinking-block.planning {
            border-left-color: #ffa500;
        }

        .thinking-block.reflection {
            border-left-color: #9b59b6;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            opacity: 0.7;
        }

        .block-type {
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .block-timestamp {
            font-family: 'Courier New', monospace;
        }

        .block-content {
            color: #ffffff;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Custom scrollbar */
        .thinking-container::-webkit-scrollbar {
            width: 8px;
        }

        .thinking-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .thinking-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="thinking-container" id="thinking-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io('http://localhost:8000');
        const container = document.getElementById('thinking-container');
        const maxBlocks = 5;

        socket.on('connect', () => {
            console.log('Thinking blocks overlay connected');
        });

        socket.on('thinking_block', (data) => {
            addThinkingBlock(data);
        });

        function addThinkingBlock(data) {
            const block = document.createElement('div');
            block.className = `thinking-block ${data.blockType || 'reasoning'}`;

            const timestamp = new Date(data.timestamp || Date.now()).toLocaleTimeString();

            block.innerHTML = `
                <div class="block-header">
                    <span class="block-type">${data.blockType || 'reasoning'}</span>
                    <span class="block-timestamp">${timestamp}</span>
                </div>
                <div class="block-content">${escapeHtml(data.content)}</div>
            `;

            container.insertBefore(block, container.firstChild);

            // Remove old blocks
            while (container.children.length > maxBlocks) {
                container.removeChild(container.lastChild);
            }

            // Auto-scroll to top
            container.scrollTop = 0;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Test data on connect
        socket.on('connect', () => {
            setTimeout(() => {
                addThinkingBlock({
                    content: 'Analyzing the codebase structure...',
                    blockType: 'reasoning',
                    timestamp: new Date().toISOString()
                });
            }, 1000);
        });
    </script>
</body>
</html>
